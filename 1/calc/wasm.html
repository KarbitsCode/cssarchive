<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="text/javascript" src="../main/common.js"></script>
    <link rel="stylesheet" href="button.css">
    <link rel="icon" href="icon.png">
    <title>Simple Calculator</title>
</head>
<body bgcolor="#FFFFFF">
    <table>
        <tr>
            <th colspan="4">
                <input type="text" id="field" value="Loading..." readonly>
            </th>
        </tr>
        <tr>
            <td colspan="2">
                <button class="red" onclick="allclear()">&#65;&#67;</button>
            </td>
            <td colspan="1">
                <button class="blue" onclick="clearfield()">&#67;</button>
            </td>
            <td colspan="1">
                <button class="orange" onclick="append('*')">&ast;</button>
            </td>
        </tr>
        <tr>
            <td colspan="1">
                <button onclick="append('7')">&#55;</button>
            </td>
            <td colspan="1">
                <button onclick="append('8')">&#56;</button>
            </td>
            <td colspan="1">
                <button onclick="append('9')">&#57;</button>
            </td>
            <td colspan="1">
                <button class="orange" onclick="append('/')">&#47;</button>
            </td>
        </tr>
        <tr>
            <td colspan="1">
                <button onclick="append('4')">&#52;</button>
            </td>
            <td colspan="1">
                <button onclick="append('5')">&#53;</button>
            </td>
            <td colspan="1">
                <button onclick="append('6')">&#54;</button>
            </td>
            <td colspan="1">
                <button class="orange" onclick="append('+')">&plus;</button>
            </td>
        </tr>
        <tr>
            <td colspan="1">
                <button onclick="append('1')">&#49;</button>
            </td>
            <td colspan="1">
                <button onclick="append('2')">&#50;</button>
            </td>
            <td colspan="1">
                <button onclick="append('3')">&#51;</button>
            </td>
            <td colspan="1">
                <button class="orange" onclick="append('-')">&minus;</button>
            </td>
        </tr>
        <tr>
            <td colspan="1">
                <button onclick="backspace()">&larr;</button>
            </td>
            <td colspan="1">
                <button onclick="append('0')">&#48;</button>
            </td>
            <td colspan="1">
                <button onclick="append('.')">&period;</button>
            </td>
            <td colspan="1">
                <button class="green" onclick="calculate()">&equals;</button>
            </td>
        </tr>
    </table>
    <script>
        const input_field = document.getElementById("field");
        const input_history = new Array();
        const undo_history = new Array();
        const redo_history = new Array();
        let history_viewstate = -1;
        let results_shown = false;
        let input_temp = "";
        
        function inputready() {
            input_field.value = "Ready";
            input_field.removeAttribute("readonly");
        }
        
        function inputerror() {
            input_field.value = "Error";
            input_field.setAttribute("disabled", "");
        }
        
        function saveundo(action) {
            undo_history.push({
                value: input_field.value,
                start: input_field.selectionStart,
                end: input_field.selectionEnd
            });
            redo_history.length = 0;
            action();
        }
        
        function clearfield() {
            if (/^(Loading.{3})$/.test(input_field.value) || input_field.hasAttribute("readonly") || input_field.hasAttribute("disabled")) return;
            history_viewstate = input_history.length;
            input_field.value = "";
            results_shown = false;
        }
        
        function allclear() {
            if (/^(Loading.{3})$/.test(input_field.value) || input_field.hasAttribute("readonly") || input_field.hasAttribute("disabled")) return;
            input_history.length = 0;
            clearfield();
        }
        
        function append(value) {
            if (/^(Loading.{3})$/.test(input_field.value) || input_field.hasAttribute("readonly") || input_field.hasAttribute("disabled")) return;
            if (/^(Ready?|Error?|NaN?|-?Infinity?)$/.test(input_field.value)) clearfield();
            if (results_shown) {
                if (!(/^-?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$/.test(input_field.value))) {
                    clearfield();
                } else {
                    input_field.selectionStart = input_field.selectionEnd = input_field.value.length;
                }
                results_shown = false;
            }
            if (document.activeElement !== input_field) input_field.focus();
            let input_field_start = input_field.selectionStart;
            let input_field_end = input_field.selectionEnd;
            if (input_field_start == null || input_field_end == null) {
                input_field_start = input_field.value.length;
                input_field_end = input_field.value.length;
            }
            saveundo(function() {
                input_field.value = input_field.value.slice(0, input_field_start) + value + input_field.value.slice(input_field_end);
                input_field.setSelectionRange(input_field_start + value.length, input_field_start + value.length);
                input_field.scrollLeft = input_field.scrollWidth;
            });
        }
        
        function backspace() {
            if (/^(Loading.{3})$/.test(input_field.value) || input_field.hasAttribute("readonly") || input_field.hasAttribute("disabled")) return;
            if (/^(Ready?|Error?|NaN?|-?Infinity?)$/.test(input_field.value)) clearfield();
            if (results_shown) {
                if (!(/^-?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$/.test(input_field.value))) clearfield();
                results_shown = false;
            }
            if (document.activeElement !== input_field) input_field.focus();
            let input_field_start = input_field.selectionStart;
            let input_field_end = input_field.selectionEnd;
            if (input_field_start == null || input_field_end == null || (input_field_start === 0 && input_field_end === 0 && input_field.value.length > 0)) {
                input_field_start = input_field.value.length;
                input_field_end = input_field.value.length;
                input_field.setSelectionRange(input_field_start, input_field_end);
            }
            saveundo(function() {
                if (input_field_start === input_field_end && input_field_start !== 0 && input_field_start <= input_field.value.length) {
                    input_field.value = input_field.value.slice(0, input_field_start - 1) + input_field.value.slice(input_field_end);
                    input_field.setSelectionRange(input_field_start - 1, input_field_start - 1);
                } else if (input_field_start !== input_field_end) {
                    input_field.value = input_field.value.slice(0, input_field_start) + input_field.value.slice(input_field_end);
                    input_field.setSelectionRange(input_field_start, input_field_start);
                }
            });
        }
        
        function deletekey() {
            if (/^(Loading.{3})$/.test(input_field.value) || input_field.hasAttribute("readonly") || input_field.hasAttribute("disabled")) return;
            if (/^(Ready?|Error?|NaN?|-?Infinity?)$/.test(input_field.value)) clearfield();
            if (results_shown) {
                if (!(/^-?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$/.test(input_field.value))) clearfield();
                results_shown = false;
            }
            if (document.activeElement !== input_field) input_field.focus();
            let input_field_start = input_field.selectionStart;
            let input_field_end = input_field.selectionEnd;
            if (input_field_start == null || input_field_end == null) {
                input_field_start = input_field.value.length;
                input_field_end = input_field.value.length;
            }
            saveundo(function() {
                if (input_field_start === input_field_end && input_field_start < input_field.value.length) {
                    input_field.value = input_field.value.slice(0, input_field_start) + input_field.value.slice(input_field_start + 1);
                    input_field.setSelectionRange(input_field_start, input_field_start);
                } else if (input_field_start !== input_field_end) {
                    input_field.value = input_field.value.slice(0, input_field_start) + input_field.value.slice(input_field_end);
                    input_field.setSelectionRange(input_field_start, input_field_start);
                }
            });
        }
        
        function calculate() {
            if (/^(Loading.{3})$/.test(input_field.value) || input_field.hasAttribute("readonly") || input_field.hasAttribute("disabled")) return;
            saveundo(function() {
                try {
                    const input = input_field.value;
                    const result = calculate_send(input);
                    input_field.value = result;
                    results_shown = true;
                    if (input.trim() !== "") {
                        input_history.push(input);
                        history_viewstate = input_history.length;
                    }
                } catch(e) {
                    console.error(e);
                    input_field.value = "Error";
                }
            });
        }
        
        input_field.onkeydown = input_field.oninput = async function(event) {
            if (event.key === "Backspace") {
                event.preventDefault();
                backspace();
            } else if (event.key === "Delete") {
                event.preventDefault();
                deletekey();
            } else if (event.key === "Enter") {
                event.preventDefault();
                calculate();
            } else if (event.ctrlKey && /^a$/i.test(event.key)) {
                event.preventDefault();
                input_field.select();
            } else if (event.ctrlKey && /^c$/i.test(event.key)) {
                event.preventDefault();
                const text = input_field.value.slice(input_field.selectionStart, input_field.selectionEnd);
                await navigator.clipboard.writeText(text);
            } else if (event.ctrlKey && /^x$/i.test(event.key)) {
                event.preventDefault();
                const start = input_field.selectionStart;
                const end = input_field.selectionEnd;
                await navigator.clipboard.writeText(input_field.value.slice(start, end));
                saveundo(function() {input_field.setRangeText("", start, end, "start")});
            } else if (event.ctrlKey && /^v$/i.test(event.key)) {
                event.preventDefault();
                const text = await navigator.clipboard.readText();
                saveundo(function() {input_field.setRangeText(text, input_field.selectionStart, input_field.selectionEnd, "end")});
            } else if (event.ctrlKey && /^z$/i.test(event.key)) {
                event.preventDefault();
                if (undo_history.length > 0) {
                    redo_history.push({
                        value: input_field.value,
                        start: input_field.selectionStart,
                        end: input_field.selectionEnd
                    });
                    const state = undo_history.pop();
                    input_field.value = state.value;
                    input_field.setSelectionRange(state.start, state.end);
                }
            } else if (event.ctrlKey && /^y$/i.test(event.key)) {
                event.preventDefault();
                if (redo_history.length > 0) {
                    undo_history.push({
                        value: input_field.value,
                        start: input_field.selectionStart,
                        end: input_field.selectionEnd
                    });
                    const state = redo_history.pop();
                    input_field.value = state.value;
                    input_field.setSelectionRange(state.start, state.end);
                }
            } else if (event.key === "ArrowUp") {
                event.preventDefault();
                if (input_history.length === 0) return;
                if (history_viewstate === input_history.length) input_temp = input_field.value;
                if (history_viewstate > 0) {
                    history_viewstate--;
                    input_field.value = input_history[history_viewstate];
                }
            } else if (event.key === "ArrowDown") {
                event.preventDefault();
                if (input_history.length === 0) return;
                if (history_viewstate < input_history.length - 1) {
                    history_viewstate++;
                    input_field.value = input_history[history_viewstate];
                } else {
                    history_viewstate = input_history.length;
                    input_field.value = input_temp;
                }
            } else if (/^[a-zA-Z0-9!@#$%^&*()\-_=+\[\]{}|;:'",.<>?/~\\` ]$/.test(event.key)) { //`
                event.preventDefault();
                append(event.key);
            }
        }
        
        window.onkeydown = function(event) {
            if (document.activeElement !== input_field) {
                event.preventDefault();
                input_field.focus();
                input_field.dispatchEvent(new KeyboardEvent(event.type, event));
            }
        }
    </script>
    <script src="loader.js" onerror="inputerror()"></script>
</body>
</html>
